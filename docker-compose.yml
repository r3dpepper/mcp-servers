# ── MCP Hub — Docker Compose ─────────────────────────────────────────────────
#
# Usage:
#   cp .env.example .env.local
#   # fill in your API keys in .env.local
#   docker compose --env-file .env.local up --build
#
# To run a single server:
#   docker compose --env-file .env.local up google-search
#   docker compose --env-file .env.local up duckduckgo-search
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Google Search MCP Server (requires API key) ──────────────────────────
  google-search:
    build:
      context: .
      dockerfile: docker/google-search/Dockerfile
    container_name: mcp-google-search
    restart: unless-stopped
    ports:
      - "${GOOGLE_SEARCH_PORT:-3001}:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CSE_ID: ${GOOGLE_CSE_ID}
      GOOGLE_SEARCH_MAX_RESULTS: ${GOOGLE_SEARCH_MAX_RESULTS:-10}
      TRANSPORT: http
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      mcp.server: "google-search"
      mcp.version: "1.0.0"
      mcp.requires_api_key: "true"

  # ── DuckDuckGo Search MCP Server (no API key needed) ────────────────────
  duckduckgo-search:
    build:
      context: .
      dockerfile: docker/duckduckgo-search/Dockerfile
    container_name: mcp-duckduckgo-search
    restart: unless-stopped
    ports:
      - "${DUCKDUCKGO_SEARCH_PORT:-3002}:3002"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DUCKDUCKGO_SEARCH_MAX_RESULTS: ${DUCKDUCKGO_SEARCH_MAX_RESULTS:-10}
      DUCKDUCKGO_TIMEOUT_MS: ${DUCKDUCKGO_TIMEOUT_MS:-10000}
      TRANSPORT: http
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      mcp.server: "duckduckgo-search"
      mcp.version: "1.0.0"
      mcp.requires_api_key: "false"

  # ── Browser MCP Server (no API key needed) ────────────────────────────────
  browser:
    build:
      context: docker/browser
      dockerfile: docker/browser/Dockerfile
    container_name: mcp-browser
    restart: unless-stopped
    ports:
      - "${BROWSER_PORT:-3003}:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BROWSER_MAX_CONTEXTS: ${BROWSER_MAX_CONTEXTS:-3}
      BROWSER_CONTEXT_TIMEOUT: ${BROWSER_CONTEXT_TIMEOUT:-30000}
      BROWSER_NAV_TIMEOUT: ${BROWSER_NAV_TIMEOUT:-15000}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-10000}
      TRANSPORT: http
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      mcp.server: "browser"
      mcp.version: "1.0.0"
      mcp.requires_api_key: "false"

  # ── Fetch MCP Server (no API key needed) ────────────────────────────────
  fetch:
    build:
      context: .
      dockerfile: docker/fetch/Dockerfile
    container_name: mcp-fetch
    restart: unless-stopped
    ports:
      - "${FETCH_PORT:-3005}:3005"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FETCH_PORT: 3005
      FETCH_TIMEOUT_MS: ${FETCH_TIMEOUT_MS:-30000}
      FETCH_MAX_CONTENT_LENGTH: ${FETCH_MAX_CONTENT_LENGTH:-1048576}
      TRANSPORT: http
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      mcp.server: "fetch"
      mcp.version: "1.0.0"
      mcp.requires_api_key: "false"

# ── Shared network so servers can discover each other ─────────────────────
networks:
  default:
    name: mcp-hub-network
